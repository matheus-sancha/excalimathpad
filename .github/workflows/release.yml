name: Release

# The Release button (docs/spec-v1.md section 12a, Releases). Run by hand from
# Actions, on `main`, with patch, minor or major. It bumps the one version
# (`npm version`, which also moves manifest.json and versions.json, and tags
# without a `v`), runs the whole check against the bumped build, then pushes
# the commit and tag to `main` together and drafts a GitHub release with the
# plugin's three files and the pre-publish checklist. Matheus publishes it.
#
# Nothing reaches `main` unless the check passed, and no release is drafted
# unless the push landed. A push made with this run's token starts no other
# workflow, so CI and the hosted deploy don't run for the release commit; the
# next push to `main` deploys as usual (the web app shows no version).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise (the first release is minor, from 0.0.0 to 0.1.0)
        type: choice
        options: [patch, minor, major]
        default: patch

# Push the version commit and tag to `main`, and draft the release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          # The same floor as CI.
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Bump the version (commit and tag, not yet pushed)
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$BUMP"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      # The build the check makes is the one attached: its stamp is the new version.
      - run: npm run check
      - name: Push the commit and tag to main
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$VERSION"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            dist-plugin/main.js dist-plugin/manifest.json dist-plugin/styles.css \
            --draft --verify-tag --title "$VERSION" \
            --notes-file .github/release-checklist.md --generate-notes
