name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Lowest version in package.json `engines`, so CI proves the floor.
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run check
