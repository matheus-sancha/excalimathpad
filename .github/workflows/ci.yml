name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Lowest version in package.json `engines`, so CI proves the floor.
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run check
      # The build the check just made is the one that deploys, so the hosted
      # app is exactly what passed.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # The hosted build (docs/spec-v1.md section 12): a push to `main` that
  # passed the check publishes its `dist/` to Cloudflare Pages. A pull request
  # never reaches this job, so it deploys nothing and reads no secret. Until
  # the repository variable names a Pages project, the job is skipped.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` makes this the production deployment, whatever
          # the project's production branch setting reads by default.
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
